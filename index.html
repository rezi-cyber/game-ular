<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title><style>
body{
    margin:0;
    background:#222;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
}

#game{
    background:black;
    border:3px solid white;
}

#controls{
    margin-top:15px;
    text-align:center;
}

#controls button{
    width:70px;
    height:70px;
    font-size:30px;
    margin:4px;
    border:none;
    border-radius:12px;
    background:#444;
    color:white;
}

#controls button:active{
    background:#666;
}
</style></head>
<body><canvas id="game" width="400" height="400"></canvas>

<div id="controls">
    <div>
        <button onclick="setDirection('up')">↑</button>
    </div><div>
    <button onclick="setDirection('left')">←</button>
    <button onclick="setDirection('down')">↓</button>
    <button onclick="setDirection('right')">→</button>
</div>

</div><script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

const appleImg = new Image();
appleImg.src = "apel.png";

let snake = [
    {x:200,y:200}
];

let food = randomFood();

let dx = box;
let dy = 0;

let score = 0;
let gameOver = false;

document.addEventListener("keydown", changeDirection);

function randomFood(){
    return{
        x:Math.floor(Math.random()*20)*box,
        y:Math.floor(Math.random()*20)*box
    };
}

function setDirection(dir){

    if(dir==="up" && dy===0){
        dx=0;
        dy=-box;
    }

    if(dir==="down" && dy===0){
        dx=0;
        dy=box;
    }

    if(dir==="left" && dx===0){
        dx=-box;
        dy=0;
    }

    if(dir==="right" && dx===0){
        dx=box;
        dy=0;
    }
}

function changeDirection(e){

    if(e.key==="ArrowUp"){
        setDirection("up");
    }

    if(e.key==="ArrowDown"){
        setDirection("down");
    }

    if(e.key==="ArrowLeft"){
        setDirection("left");
    }

    if(e.key==="ArrowRight"){
        setDirection("right");
    }
}

function checkCollision(head){
    for(let i=0;i<snake.length;i++){
        if(
            head.x===snake[i].x &&
            head.y===snake[i].y
        ){
            return true;
        }
    }
    return false;
}

function draw(){

    if(gameOver) return;

    ctx.fillStyle="black";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText("Score: "+score,10,25);

    if(appleImg.complete){
        ctx.drawImage(
            appleImg,
            food.x,
            food.y,
            box,
            box
        );
    }else{
        ctx.fillStyle="red";
        ctx.fillRect(
            food.x,
            food.y,
            box,
            box
        );
    }

    let head={
        x:snake[0].x+dx,
        y:snake[0].y+dy
    };

    if(
        head.x<0 ||
        head.x>=400 ||
        head.y<0 ||
        head.y>=400
    ){
        endGame();
        return;
    }

    if(checkCollision(head)){
        endGame();
        return;
    }

    if(
        head.x===food.x &&
        head.y===food.y
    ){
        score++;
        food=randomFood();
    }else{
        snake.pop();
    }

    snake.unshift(head);

    snake.forEach((part,index)=>{

        ctx.fillStyle=
        index===0 ? "#00ff00" : "#00aa00";

        ctx.fillRect(
            part.x,
            part.y,
            box,
            box
        );

        ctx.strokeStyle="#003300";
        ctx.strokeRect(
            part.x,
            part.y,
            box,
            box
        );
    });
}

function endGame(){

    gameOver=true;

    ctx.fillStyle="rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,400,400);

    ctx.fillStyle="red";
    ctx.font="40px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "GAME OVER",
        200,
        180
    );

    ctx.fillStyle="white";
    ctx.font="25px Arial";
    ctx.fillText(
        "Score: "+score,
        200,
        230
    );
}

setInterval(draw,150);
</script></body>
</html>
